plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.rhk93.scudo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rhk93.scudo'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
