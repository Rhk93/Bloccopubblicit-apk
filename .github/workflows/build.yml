name: Compila Scudo

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Se hai caricato uno zip, lo apre, mette i file nelle cartelle giuste,
      # cancella lo zip e salva tutto nella repository.
      - name: Estrai lo zip caricato
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              unzip -o "$z"
              rm -f "$z"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "File estratti dallo zip" || true
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila APK
        run: gradle assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp $(find build/outputs/apk/debug -name "*.apk" | head -n 1) Scudo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Scudo
          path: Scudo.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Scudo ${{ github.run_number }}
          files: Scudo.apk
